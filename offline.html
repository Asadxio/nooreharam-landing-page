<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — NOOR-E-HARAM</title>
  <link rel="stylesheet" href="/assets/css/core.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--cream);
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px;
      max-width: 480px;
      box-shadow: var(--shadow);
    }
    .offline-icon {
      font-size: 64px;
      margin-bottom: 24px;
      display: block;
    }
    .offline-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      color: var(--charcoal);
      margin-bottom: 16px;
    }
    .offline-desc {
      color: var(--text-mid);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .offline-btn {
      width: 100%;
      justify-content: center;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon" style="display:flex;justify-content:center;color:var(--gold-base);">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
    </div>
    <h1 class="offline-title">You are Offline</h1>
    <p class="offline-desc">It looks like you don't have an active internet connection right now. Don't worry, you can still call us directly to book or ask questions.</p>
    <a href="tel:+919986925592" class="btn btn-primary offline-btn" style="display:inline-flex;align-items:center;gap:8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      <span>Call +91 99869 25592</span>
    </a>
    <button onclick="window.location.reload()" class="btn btn-outline offline-btn" style="color: var(--emerald); border-color: var(--emerald); display:inline-flex;align-items:center;gap:8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
      <span>Retry Connection</span>
    </button>
  </div>
</body>
</html>
