name: Automated Playwright Production Quality Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Playwright Chromium
      run: |
        npm init -y
        npm install playwright
        npx playwright install --with-deps chromium

    - name: Run Production Quality Tests
      run: |
        node tests/validate_all.js
        node tests/ci_test.js
